# builds Glint.app on a mac runner. it doesn't publish anything, echogd.com stays the only release
#   gh workflow run macos.yml --ref v0.0.2
#   gh run download --name glint-macos --dir ~/Downloads/glint-macos
#   scripts/release.sh ~/Downloads/glint-macos/glint-macos.{zip,dmg}
# the zip is for the updater (ASSET in src/update.rs), the dmg is for people
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # weft is private; this key is a read-only deploy key on lcm7341/weft
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WEFT_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Glint.app and the dmg
        run: ./scripts/bundle-macos.sh

      - name: Zip it
        run: |
          ditto -c -k --keepParent target/release/Glint.app glint-macos.zip
          cp target/release/glint-macos.dmg glint-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: glint-macos
          path: |
            glint-macos.zip
            glint-macos.dmg
          if-no-files-found: error
