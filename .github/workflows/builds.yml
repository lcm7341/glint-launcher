# builds glint for windows and macos on github's runners, linux builds locally in release.sh.
# it doesn't publish anything, echogd.com stays the only release
# runs on every push, or by hand: gh workflow run builds.yml --ref master
#   gh run download <run id> --dir ~/Downloads/glint-builds
#   scripts/release.sh ~/Downloads/glint-builds/*/glint-*
# the mac zip is for the updater (ASSET in src/update.rs), the dmg is for people
name: Glint builds

on:
  workflow_dispatch:
  push:

# a newer push on the same ref replaces a build still running, mac minutes count 10x
concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  # cargo's own git can't use the ssh agent on windows
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # weft is private; this key is a read-only deploy key on lcm7341/weft
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WEFT_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Glint.app and the dmg
        run: ./scripts/bundle-macos.sh

      - name: Zip it
        run: |
          ditto -c -k --keepParent target/release/Glint.app glint-macos.zip
          cp target/release/glint-macos.dmg glint-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: glint-macos
          path: |
            glint-macos.zip
            glint-macos.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WEFT_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build glint.exe
        shell: bash
        run: |
          cargo build --release --locked --bin glint
          cp target/release/glint.exe glint-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: glint-windows
          path: glint-windows-x86_64.exe
          if-no-files-found: error
