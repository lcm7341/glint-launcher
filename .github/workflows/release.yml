# Push a tag like v0.0.2 (matching Cargo.toml's version) to build and publish a release.
# Glint's updater downloads the assets by name, so keep them in sync with ASSET in src/update.rs
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: glint-windows-x86_64.exe
          - os: ubuntu-24.04
            asset: glint-linux-x86_64
          - os: macos-latest
            asset: glint-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      # weft is private; this key is a read-only deploy key on lcm7341/weft
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WEFT_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked --bin glint
          cp target/release/glint.exe "${{ matrix.asset }}"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --bin glint
          cp target/release/glint "${{ matrix.asset }}"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos.sh
          ditto -c -k --keepParent target/release/Glint.app "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "glint $GITHUB_REF_NAME" \
            --generate-notes
